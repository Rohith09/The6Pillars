[project]
name = "pillars"
version = "0.1.0"
description = "Multi-agent AWS Well-Architected review for your Terraform plan"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.117.0",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "cfn-flip>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pillars = "pillars.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pillars"]

[tool.hatch.build.targets.wheel.force-include]
"src/pillars/agents/rubrics" = "pillars/agents/rubrics"
