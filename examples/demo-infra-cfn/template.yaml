AWSTemplateFormatVersion: "2010-09-09"
Description: Deliberately flawed demo infra for `pillars review` — do not deploy as-is.

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: my-personal-project-data-bucket
      AccessControl: PublicRead

  # References DataBucket via Ref/GetAtt — shows up as an edge in the architecture diagram,
  # and gives the Security agent a real relationship to reason about (the origin's OAC is left
  # empty below, so the bucket is still directly public alongside the CDN — a genuine finding,
  # not something the diagram should make disappear).
  CDN:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultCacheBehavior:
          TargetOriginId: !Ref DataBucket
          ViewerProtocolPolicy: redirect-to-https
        Origins:
          - Id: !Ref DataBucket
            DomainName: !GetAtt DataBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""

  MainDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: my-app-db
      Engine: postgres
      EngineVersion: "15.4"
      DBInstanceClass: db.t3.medium
      AllocatedStorage: "20"
      DBName: appdb
      MasterUsername: appadmin
      MasterUserPassword: changeme123!
      MultiAZ: false
      PubliclyAccessible: false
      StorageEncrypted: false
      DeletionProtection: false
      BackupRetentionPeriod: 0
